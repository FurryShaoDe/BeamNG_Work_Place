<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BEAMNG.DRIVE 多赛道圈速榜</title>
  <meta name="description" content="BeamNG.drive 多赛道圈速排行榜：按赛道内排名展示各车辆最快圈速、马力、驱动与动力类型，支持筛选与排序。">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    /* ==================== 设计令牌 ==================== */
    :root {
      /* ===== 背景 ===== */
      --bg-primary: #1e1d1a;
      --bg-primary-rgb: 30, 29, 26;
      --bg-secondary: #262521;
      --bg-secondary-rgb: 38, 37, 33;
      --bg-card-color: #3c3b34;
      --bg-card-rgb: 60, 59, 52;
      --bg-card: rgba(var(--bg-card-rgb), 0.65);
      --bg-card-hover-color: #837f5e;
      --bg-card-hover-rgb: 131, 127, 94;
      --bg-card-hover: rgba(var(--bg-card-hover-rgb), 0.7);
      /* ===== 边框（主文字色的半透明） ===== */
      --border-subtle: rgba(var(--text-primary-rgb), 0.08);
      --border-strong: rgba(var(--text-primary-rgb), 0.15);
      /* ===== 文字 ===== */
      --text-primary: #dbd8c1;
      --text-primary-rgb: 219, 216, 193;
      --text-secondary: #b3b984;
      --text-secondary-rgb: 179, 185, 132;
      --text-muted: #837f5e;
      --text-muted-rgb: 131, 127, 94;
      --text-warm: #e8e4cf;
      /* ===== 强调色 ===== */
      --accent-pink: #c3b867;
      --accent-pink-rgb: 195, 184, 103;
      --accent-orange: #b3b984;
      --accent-orange-rgb: 179, 185, 132;
      --accent-cyan: #dbd8c1;
      --accent-cyan-rgb: 219, 216, 193;
      --accent-gold: #c3b867;
      --accent-gold-rgb: 195, 184, 103;
      --accent-silver: #dbd8c1;
      --accent-silver-rgb: 219, 216, 193;
      --accent-bronze: #837f5e;
      --accent-bronze-rgb: 131, 127, 94;
      --accent-green: #b3b984;
      --accent-green-rgb: 179, 185, 132;
      --accent-blue: #837f5e;
      --accent-blue-rgb: 131, 127, 94;
      --accent-red: #dbd8c1;
      --accent-red-rgb: 219, 216, 193;
      /* ===== 名次徽章深端 ===== */
      --badge-gold-end: #b7a85e;
      --badge-silver-end: #b3b984;
      --badge-bronze-end: #626054;
      /* ===== 阴影 ===== */
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.25);
      --shadow-md: 0 10px 28px rgba(26, 25, 19, 0.45);
      --shadow-glow-pink: 0 0 20px rgba(var(--accent-gold-rgb), 0.18);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
                   'Microsoft YaHei', 'Helvetica Neue', sans-serif;
      background:
        radial-gradient(ellipse at top left, rgba(var(--accent-gold-rgb), 0.06), transparent 50%),
        radial-gradient(ellipse at bottom right, rgba(var(--accent-green-rgb), 0.05), transparent 50%),
        linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
      background-attachment: fixed;
      color: var(--text-primary);
      padding: 16px;
      min-height: 100vh;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    /* ==================== 顶部头部 ==================== */
    header {
      text-align: center;
      margin-bottom: 24px;
      padding: 28px 20px;
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-subtle);
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow-md);
      position: relative;
      overflow: hidden;
    }

    header::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent-gold), var(--text-warm));
    }

    h1 {
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 10px;
      background: linear-gradient(90deg, var(--accent-gold) 0%, var(--text-warm) 60%, var(--accent-cyan) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }

    .game-info {
      color: var(--text-secondary);
      font-size: 0.9rem;
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .game-info span {
      color: var(--accent-cyan);
      font-weight: 600;
    }

    .game-info .divider {
      color: var(--text-muted);
    }

    /* ==================== 赛道标签页 ==================== */
    .track-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 24px;
      padding: 4px;
    }

    .track-tab {
      padding: 10px 18px;
      background: var(--bg-card);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: var(--transition);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      font-weight: 600;
      font-size: 0.92rem;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(8px);
    }

    .track-tab:hover {
      background: var(--bg-card-hover);
      color: var(--accent-cyan);
      border-color: rgba(var(--accent-gold-rgb), 0.4);
      transform: translateY(-1px);
    }

    .track-tab.active {
      background: linear-gradient(135deg, var(--accent-pink), var(--accent-orange));
      color: white;
      border-color: transparent;
      box-shadow: var(--shadow-glow-pink);
    }

    .track-tab .track-count {
      background: rgba(0, 0, 0, 0.35);
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
    }

    .track-tab.active .track-count {
      background: rgba(255, 255, 255, 0.25);
    }

    /* ==================== 内容区域 ==================== */
    .track-content {
      display: none;
      animation: fadeIn 0.4s ease;
    }

    .track-content.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .track-header {
      text-align: center;
      margin-bottom: 20px;
      padding: 24px 20px;
      background: var(--bg-card);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      backdrop-filter: blur(8px);
    }

    .track-name {
      font-size: clamp(1.4rem, 3vw, 1.9rem);
      font-weight: 800;
      margin-bottom: 8px;
      color: var(--accent-orange);
      text-shadow: 0 0 20px rgba(var(--accent-gold-rgb), 0.3);
    }

    .track-layouts {
      color: var(--accent-cyan);
      font-size: 0.9rem;
      font-weight: 500;
    }

    .track-meta {
      margin-top: 10px;
      color: var(--text-secondary);
      font-size: 0.88rem;
    }

    .track-meta strong {
      color: var(--accent-orange);
    }

    /* ==================== 表单控件 ==================== */
    select, button, input {
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong);
      background: rgba(var(--bg-primary-rgb), 0.7);
      color: var(--text-primary);
      font-size: 0.85rem;
      min-width: 110px;
      font-family: inherit;
      transition: var(--transition);
    }

    select:focus, input:focus {
      outline: none;
      border-color: var(--accent-cyan);
      box-shadow: 0 0 0 3px rgba(var(--accent-gold-rgb), 0.15);
    }

    select:hover, input:hover {
      border-color: rgba(var(--accent-gold-rgb), 0.4);
    }

    button {
      background: linear-gradient(135deg, var(--accent-pink), var(--accent-orange));
      border: none;
      cursor: pointer;
      font-weight: 700;
      color: white;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow-glow-pink);
    }

    button:active {
      transform: translateY(0);
    }

    /* ==================== 加载状态 ==================== */
    .loading {
      display: none;
      text-align: center;
      padding: 40px 20px;
      color: var(--accent-cyan);
      font-size: 1rem;
    }

    .loading.active {
      display: block;
    }

    .spinner {
      display: inline-block;
      width: 22px;
      height: 22px;
      border: 3px solid rgba(var(--accent-gold-rgb), 0.2);
      border-radius: 50%;
      border-top-color: var(--accent-cyan);
      animation: spin 0.8s linear infinite;
      margin-right: 10px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ==================== 表格 ==================== */
    .table-container {
      width: 100%;
      overflow-x: auto;
      border-radius: var(--radius-md);
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      margin-top: 16px;
      backdrop-filter: blur(8px);
      box-shadow: var(--shadow-sm);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
      min-width: 980px;
    }

    thead {
      position: sticky;
      top: 0;
      z-index: 1;
    }

    th {
      background: linear-gradient(180deg, rgba(52, 51, 45, 0.95), rgba(30, 29, 26, 0.95));
      padding: 14px 12px;
      text-align: center;
      font-weight: 700;
      color: var(--accent-cyan);
      border-bottom: 2px solid var(--accent-pink);
      cursor: pointer;
      user-select: none;
      position: relative;
      white-space: nowrap;
      transition: var(--transition);
      font-size: 0.85rem;
      letter-spacing: 0.3px;
    }

    th.sortable:hover {
      background: linear-gradient(180deg, rgba(65, 64, 57, 0.95), rgba(30, 29, 26, 0.95));
      color: var(--accent-orange);
    }

    th.sort-asc::after {
      content: " ▲";
      position: absolute;
      right: 8px;
      color: var(--accent-orange);
      font-size: 0.75rem;
    }

    th.sort-desc::after {
      content: " ▼";
      position: absolute;
      right: 8px;
      color: var(--accent-orange);
      font-size: 0.75rem;
    }

    td {
      padding: 12px 10px;
      border-bottom: 1px solid var(--border-subtle);
      white-space: nowrap;
      text-align: center;
      transition: background-color 0.2s;
    }

    tbody tr {
      transition: background 0.2s, transform 0.2s;
    }

    tbody tr:hover {
      background: rgba(var(--accent-gold-rgb), 0.1) !important;
    }

    tbody tr:nth-child(odd) {
      background: rgba(255, 255, 255, 0.02);
    }

    tbody tr:nth-child(even) {
      background: rgba(255, 255, 255, 0.005);
    }

    /* ==================== 前三名高亮 ==================== */
    .rank-1 {
      background: linear-gradient(90deg, rgba(var(--accent-gold-rgb), 0.18), rgba(var(--accent-gold-rgb), 0.04)) !important;
      border-left: 4px solid var(--accent-gold);
    }

    .rank-1 .time-cell {
      font-size: 1.15rem;
      color: var(--accent-gold) !important;
      text-shadow: 0 0 10px rgba(var(--accent-gold-rgb), 0.3);
    }

    .rank-1 .rank-badge {
      background: linear-gradient(135deg, var(--accent-gold), var(--badge-gold-end));
      color: #1a1a2e;
    }

    .rank-2 {
      background: linear-gradient(90deg, rgba(var(--accent-silver-rgb), 0.15), rgba(var(--accent-silver-rgb), 0.03)) !important;
      border-left: 4px solid var(--accent-silver);
    }

    .rank-2 .rank-badge {
      background: linear-gradient(135deg, var(--accent-silver), var(--badge-silver-end));
      color: #1a1a2e;
    }

    .rank-3 {
      background: linear-gradient(90deg, rgba(var(--accent-bronze-rgb), 0.15), rgba(var(--accent-bronze-rgb), 0.03)) !important;
      border-left: 4px solid var(--accent-bronze);
    }

    .rank-3 .rank-badge {
      background: linear-gradient(135deg, var(--accent-bronze), var(--badge-bronze-end));
      color: #1a1a2e;
    }

    .rank-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      font-weight: 800;
      font-size: 0.85rem;
    }

    /* ==================== 单元格样式 ==================== */
    .time-cell {
      font-family: 'SF Mono', 'Consolas', 'Courier New', monospace;
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent-orange);
      letter-spacing: 0.5px;
    }

    .car-cell {
      font-weight: 600;
      color: var(--accent-cyan);
      text-align: left !important;
      max-width: 320px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .power-cell {
      color: var(--accent-pink);
      font-weight: 700;
    }

    .drivetrain-fwd { color: var(--accent-green); font-weight: 600; }
    .drivetrain-rwd { color: var(--accent-blue); font-weight: 600; }
    .drivetrain-awd { color: var(--accent-orange); font-weight: 600; }

    .mod-cell-yes {
      color: var(--accent-green);
      font-weight: 700;
    }

    .mod-cell-no {
      color: var(--text-muted);
    }

    .control-type {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      background: rgba(var(--accent-green-rgb), 0.15);
      color: var(--accent-green);
      border: 1px solid rgba(var(--accent-green-rgb), 0.3);
      display: inline-block;
    }

    .power-type-cell {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-weight: 600;
    }

    .power-type-cell.electric {
      color: var(--accent-cyan);
    }

    .power-type-cell.gas {
      color: var(--accent-orange);
    }

    /* ==================== 空状态 ==================== */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .empty-state .empty-icon {
      font-size: 3rem;
      margin-bottom: 12px;
      opacity: 0.5;
    }

    .empty-state .empty-title {
      font-size: 1.1rem;
      color: var(--text-secondary);
      margin-bottom: 6px;
      font-weight: 600;
    }

    .empty-state .empty-desc {
      font-size: 0.88rem;
    }

    /* ==================== 错误提示 ==================== */
    .error-message {
      background: rgba(var(--accent-red-rgb), 0.1);
      border: 1px solid rgba(var(--accent-red-rgb), 0.3);
      color: var(--accent-red);
      padding: 16px;
      border-radius: var(--radius-md);
      margin: 16px 0;
      text-align: center;
      font-weight: 500;
    }

    /* ==================== 赛道总览仪表盘 ==================== */
    .dashboard-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-top: 20px;
    }

    .dashboard-stat {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 16px;
      text-align: center;
      backdrop-filter: blur(8px);
    }

    .dashboard-stat .stat-value {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--accent-cyan);
      line-height: 1.2;
    }

    .dashboard-stat .stat-value.gold {
      color: var(--accent-gold);
    }

    .dashboard-stat .stat-label {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 18px;
      margin-top: 20px;
    }

    .track-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 18px;
      cursor: pointer;
      transition: var(--transition);
      backdrop-filter: blur(8px);
      position: relative;
      overflow: hidden;
    }

    .track-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent-gold), var(--text-warm));
      opacity: 0;
      transition: var(--transition);
    }

    .track-card:hover {
      transform: translateY(-4px);
      border-color: rgba(var(--accent-gold-rgb), 0.4);
      box-shadow: var(--shadow-md);
      background: var(--bg-card-hover);
    }

    .track-card:hover::before {
      opacity: 1;
    }

    .track-card-title {
      font-weight: 800;
      color: var(--accent-cyan);
      font-size: 1.05rem;
      margin-bottom: 4px;
    }

    .track-card-layout {
      font-size: 0.82rem;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }

    .track-card-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 16px;
      font-size: 0.85rem;
      margin-bottom: 14px;
    }

    .track-card-stats .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-width: 0;
    }

    .track-card-stats .label {
      color: var(--text-secondary);
    }

    .track-card-stats .value {
      font-weight: 600;
      color: var(--text-primary);
    }

    .track-card-stats .value.highlight {
      color: var(--accent-orange);
      font-weight: 700;
    }

    .best-record {
      grid-column: 1 / -1;
      border: 1px solid rgba(var(--accent-gold-rgb), 0.35);
      border-radius: 10px;
      padding: 10px 14px;
      background: linear-gradient(135deg, rgba(var(--accent-gold-rgb), 0.08), rgba(var(--accent-gold-rgb), 0.02));
    }

    .best-record-label {
      font-size: 0.72rem;
      color: var(--text-secondary);
      letter-spacing: 0.08em;
      margin-bottom: 4px;
    }

    .best-record-time {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--accent-gold);
      font-variant-numeric: tabular-nums;
      line-height: 1.2;
    }

    .best-record-car {
      margin-top: 4px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--accent-cyan);
      word-break: break-word;
    }

    .donut-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
      border-top: 1px solid var(--border-subtle);
      padding-top: 12px;
    }

    .donut {
      width: 84px;
      height: 84px;
      flex-shrink: 0;
    }

    .donut svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .donut-legend {
      flex: 1;
      font-size: 0.82rem;
    }

    .donut-legend .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
      color: var(--text-secondary);
    }

    .donut-legend .legend-item:last-child {
      margin-bottom: 0;
    }

    .donut-legend .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .donut-legend .legend-item .legend-count {
      margin-left: auto;
      font-weight: 600;
      color: var(--text-primary);
    }

    .power-tags {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .power-tag {
      font-size: 0.75rem;
      padding: 3px 10px;
      border-radius: 999px;
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      background: rgba(255, 255, 255, 0.03);
    }

    .power-tag .tag-icon {
      margin-right: 3px;
    }

    /* ==================== 底部统计 ==================== */
    .stats {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 20px;
      padding: 14px 18px;
      background: var(--bg-card);
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      color: var(--text-secondary);
      border: 1px solid var(--border-subtle);
      backdrop-filter: blur(8px);
      flex-wrap: wrap;
      gap: 10px;
    }

    .stats a {
      color: var(--accent-cyan);
      text-decoration: none;
      font-weight: 600;
      transition: var(--transition);
    }

    .stats a:hover {
      color: var(--accent-orange);
      text-decoration: underline;
    }

    .stats #currentRecords {
      color: var(--accent-orange);
      font-weight: 700;
    }

    /* ==================== 响应式 ==================== */
    @media (max-width: 768px) {
      body {
        padding: 10px;
      }

      .container {
        max-width: 100%;
      }

      header {
        padding: 20px 14px;
        margin-bottom: 16px;
      }

      .game-info {
        gap: 8px;
        font-size: 0.82rem;
      }

      .track-tabs {
        overflow-x: auto;
        flex-wrap: nowrap;
        padding-bottom: 8px;
        -webkit-overflow-scrolling: touch;
      }

      .track-tab {
        padding: 8px 14px;
        font-size: 0.85rem;
        flex-shrink: 0;
      }

      select, button, input {
        width: 100%;
        min-width: 0;
      }

      table {
        font-size: 0.82rem;
        min-width: 800px;
      }

      th, td {
        padding: 10px 6px;
      }

      .car-cell {
        max-width: 180px;
      }

      .stats {
        flex-direction: column;
        text-align: center;
        font-size: 0.8rem;
      }
    }

    /* ==================== 滚动条美化 ==================== */
    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 5px;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(var(--accent-gold-rgb), 0.3);
      border-radius: 5px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(var(--accent-gold-rgb), 0.5);
    }

    /* 减少动画偏好 */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* ==================== 主题调色盘 ==================== */
    #themeToggle {
      position: fixed;
      right: 20px;
      bottom: 20px;
      width: 52px;
      height: 52px;
      min-width: 0;
      padding: 0;
      border-radius: 50%;
      font-size: 1.35rem;
      z-index: 1000;
      box-shadow: var(--shadow-md);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .theme-panel {
      position: fixed;
      right: 20px;
      bottom: 84px;
      width: 300px;
      max-height: 72vh;
      overflow-y: auto;
      background: var(--bg-card);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow-md);
      z-index: 1000;
      padding: 14px;
    }

    .theme-panel[hidden] {
      display: none;
    }

    .theme-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .theme-close {
      width: 26px;
      height: 26px;
      min-width: 0;
      padding: 0;
      border-radius: 50%;
      font-size: 0.8rem;
      line-height: 1;
    }

    .theme-group-title {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin: 12px 0 4px;
    }

    .theme-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 5px 0;
    }

    .theme-item label {
      font-size: 0.82rem;
      color: var(--text-secondary);
      cursor: pointer;
      flex: 1;
    }

    .theme-item input[type="color"] {
      width: 38px;
      height: 28px;
      min-width: 0;
      padding: 2px;
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      background: rgba(var(--bg-primary-rgb), 0.6);
      cursor: pointer;
    }

    .theme-panel-actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .theme-panel-actions button {
      flex: 1;
      min-width: 0;
      padding: 7px 8px;
      font-size: 0.78rem;
    }

    .theme-preset-save {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .theme-preset-save input[type="text"] {
      flex: 1;
      min-width: 0;
      font-size: 0.8rem;
    }

    .theme-preset-save button {
      min-width: 0;
      padding: 7px 12px;
      font-size: 0.78rem;
    }

    .theme-preset-item {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
    }

    .theme-preset-apply {
      flex: 1;
      min-width: 0;
      padding: 6px 8px;
      font-size: 0.78rem;
      text-align: left;
      background: rgba(var(--bg-primary-rgb), 0.6);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }

    .theme-preset-apply:hover {
      border-color: rgba(var(--accent-gold-rgb), 0.5);
      color: var(--accent-gold);
    }

    .theme-preset-delete {
      width: 26px;
      height: 26px;
      min-width: 0;
      padding: 0;
      border-radius: 50%;
      font-size: 0.72rem;
      line-height: 1;
      background: transparent;
      border: 1px solid var(--border-strong);
      color: var(--text-muted);
    }

    .theme-preset-delete:hover {
      color: var(--accent-red);
      border-color: rgba(var(--accent-red-rgb), 0.5);
    }

    .theme-preset-empty {
      font-size: 0.78rem;
      color: var(--text-muted);
      padding: 8px 0;
      text-align: center;
    }

    .theme-preset-files {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .theme-preset-files button {
      flex: 1;
      min-width: 0;
      padding: 7px 8px;
      font-size: 0.78rem;
    }

    .theme-toast {
      position: fixed;
      left: 50%;
      bottom: 90px;
      transform: translateX(-50%);
      background: var(--bg-card-hover);
      color: var(--text-primary);
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      font-size: 0.82rem;
      z-index: 1100;
      box-shadow: var(--shadow-md);
      opacity: 0;
      transition: opacity var(--transition);
      pointer-events: none;
    }

    .theme-toast.show {
      opacity: 1;
    }

    /* ==================== 成绩录入 ==================== */
    #recordSection {
      margin-bottom: 20px;
    }

    #recordToggle {
      padding: 10px 18px;
      font-size: 0.9rem;
    }

    .record-card {
      margin-top: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 18px;
      backdrop-filter: blur(8px);
    }

    .record-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-weight: 700;
      color: var(--accent-gold);
      margin-bottom: 14px;
    }

    .record-hint {
      font-size: 0.78rem;
      font-weight: 400;
      color: var(--text-muted);
    }

    .record-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
    }

    .record-field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .record-field label {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .record-field input,
    .record-field select {
      width: 100%;
      min-width: 0;
    }

    .quick-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 2px;
    }

    .quick-chip {
      min-width: 0;
      padding: 3px 10px;
      font-size: 0.72rem;
      border-radius: 999px;
      border: 1px solid var(--border-subtle);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-secondary);
      cursor: pointer;
      transition: var(--transition);
      white-space: normal;
      overflow: visible;
      text-overflow: clip;
      max-width: none;
      text-align: left;
      line-height: 1.3;
    }

    .quick-chip:hover {
      color: var(--accent-gold);
      border-color: rgba(var(--accent-gold-rgb), 0.5);
      background: rgba(var(--accent-gold-rgb), 0.08);
    }

    .quick-chip.active {
      color: var(--accent-gold);
      border-color: rgba(var(--accent-gold-rgb), 0.6);
      background: rgba(var(--accent-gold-rgb), 0.15);
      font-weight: 600;
    }

    .quick-chip-toggle {
      border-style: dashed;
      color: var(--text-tertiary);
    }

    .quick-chip-toggle:hover {
      color: var(--accent-gold);
      border-color: rgba(var(--accent-gold-rgb), 0.5);
      background: rgba(var(--accent-gold-rgb), 0.08);
    }

    .record-actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .record-actions button {
      min-width: 0;
      padding: 9px 20px;
      font-size: 0.85rem;
    }

    #recordReset {
      background: rgba(var(--bg-primary-rgb), 0.6);
      border: 1px solid var(--border-strong);
      color: var(--text-secondary);
      font-weight: 600;
    }

    #recordReset:hover {
      color: var(--accent-gold);
      border-color: rgba(var(--accent-gold-rgb), 0.5);
      box-shadow: none;
      transform: none;
    }

    .record-status {
      margin-top: 12px;
      font-size: 0.82rem;
      color: var(--accent-gold);
    }

    .record-status.error {
      color: var(--accent-red);
    }

    @media (max-width: 768px) {
      .record-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>BEAMNG.DRIVE 多赛道圈速榜</h1>
      <div class="game-info">
        <span>数据更新： <span id="updateTime">--</span></span>
        <span class="divider">|</span>
        <span>车手： <span id="driverName">少德</span></span>
      </div>
    </header>

    <div id="recordSection" hidden>
      <button id="recordToggle">＋ 录入成绩</button>
      <div id="recordForm" class="record-card" hidden>
        <div class="record-header">
          <span>录入新成绩</span>
          <span class="record-hint">仅本地生效：数据写入 data.json，推送 GitHub 后线上展示</span>
        </div>
        <div class="record-grid">
          <div class="record-field">
            <label for="rec-track">赛道 *</label>
            <input type="text" id="rec-track" list="rec-track-list" placeholder="如：Hirochi赛车场">
            <datalist id="rec-track-list"></datalist>
            <div class="quick-chips" id="rec-track-chips"></div>
          </div>
          <div class="record-field">
            <label for="rec-layout">布局 *</label>
            <input type="text" id="rec-layout" list="rec-layout-list" placeholder="如：短途竞速环道">
            <datalist id="rec-layout-list"></datalist>
            <div class="quick-chips" id="rec-layout-chips"></div>
          </div>
          <div class="record-field">
            <label for="rec-car">车辆 *</label>
            <input type="text" id="rec-car" list="rec-car-list" placeholder="如：Ibishu Covet Track (M)">
            <datalist id="rec-car-list"></datalist>
            <div class="quick-chips" id="rec-car-chips"></div>
          </div>
          <div class="record-field">
            <label for="rec-time">圈速 *（MM:SS.mmm）</label>
            <input type="text" id="rec-time" placeholder="如：01:15.856">
          </div>
          <div class="record-field">
            <label for="rec-drivetrain">驱动</label>
            <select id="rec-drivetrain">
              <option value="前驱">前驱</option>
              <option value="后驱">后驱</option>
              <option value="四驱">四驱</option>
            </select>
          </div>
          <div class="record-field">
            <label for="rec-power-type">动力</label>
            <select id="rec-power-type">
              <option value="油车">油车</option>
              <option value="电车">电车</option>
            </select>
          </div>
          <div class="record-field">
            <label for="rec-power">马力（hp）</label>
            <input type="number" id="rec-power" min="1" placeholder="如：350">
          </div>
          <div class="record-field">
            <label for="rec-control-type">控制</label>
            <select id="rec-control-type">
              <option value="手柄">手柄</option>
              <option value="键盘">键盘</option>
              <option value="方向盘">方向盘</option>
            </select>
          </div>
          <div class="record-field">
            <label for="rec-mod">模组</label>
            <select id="rec-mod">
              <option value="否">否</option>
              <option value="是">是</option>
            </select>
          </div>
          <div class="record-field">
            <label for="rec-game-version">游戏版本</label>
            <input type="text" id="rec-game-version" placeholder="如：0.38.3">
          </div>
          <div class="record-field">
            <label for="rec-date">日期</label>
            <input type="text" id="rec-date" placeholder="如：2026-1-15">
          </div>
        </div>
        <div class="record-actions">
          <button id="recordSubmit">提交记录</button>
          <button id="recordReset">清空</button>
        </div>
        <div id="recordStatus" class="record-status" role="status"></div>
      </div>
    </div>

    <div class="track-tabs" id="trackTabs">
      <div class="track-tab active" data-track="all" role="button" tabindex="0">
        所有赛道 <span class="track-count" id="allCount">0</span>
      </div>
    </div>

    <div id="allTracksContent" class="track-content active">
      <div class="track-header">
        <div class="track-name">赛道总览</div>
        <div class="track-layouts">各赛道数据一览 · 点击卡片查看详细排名</div>
      </div>

      <div id="loading" class="loading">
        <div class="spinner"></div>正在加载数据...
      </div>

      <div id="errorContainer" style="display: none;" role="alert"></div>

      <div class="dashboard-stats" id="dashboardStats"></div>
      <div class="dashboard-grid" id="dashboardGrid"></div>
    </div>

    <div class="stats">
      <div>当前记录数：<span id="currentRecords">0</span></div>
      <div>所有赛道记录均为计时赛模式的动态起步</div>
      <div>源码：<a href="https://github.com/FurryShaoDe/BeamNG.Time_Attack" target="_blank" rel="noopener">GitHub</a></div>
    </div>
  </div>

  <button id="themeToggle" title="主题调色盘" aria-label="打开主题调色盘" aria-expanded="false">🎨</button>

  <div class="theme-panel" id="themePanel" hidden>
    <div class="theme-panel-header">
      <span>🎨 主题调色盘</span>
      <button class="theme-close" id="themeClose" aria-label="关闭调色盘">✕</button>
    </div>
    <div id="themeItems"></div>

    <div class="theme-group-title">预设</div>
    <div class="theme-preset-save">
      <input type="text" id="presetName" placeholder="预设名称" maxlength="20" aria-label="预设名称">
      <button id="presetSave">保存</button>
    </div>
    <div id="presetList"></div>
    <div class="theme-preset-files">
      <button id="presetExport">导出文件</button>
      <button id="presetImport">导入文件</button>
      <input type="file" id="presetFileInput" accept=".json,application/json" hidden>
    </div>

    <div class="theme-panel-actions">
      <button id="themeReset">恢复默认</button>
      <button id="themeCopy">复制 CSS</button>
    </div>
  </div>

  <div class="theme-toast" id="themeToast" role="status"></div>

  <script src="main.js"></script>
  <script src="record-form.js"></script>
  <script src="theme-editor.js"></script>
</body>
</html>
